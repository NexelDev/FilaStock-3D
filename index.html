<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilaStock 3D</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="1024x1024" href="./logo.png">
    <meta name="theme-color" content="#2c3e50">
    <!--<meta name="color-scheme" content="only light">-->
</head>
<body>
    <header>
        <h1>FilaStock 3D</h1>
        <button id="btn-new-drawer">+ Nouveau Tiroir</button>
    </header>

    <main>
        <aside id="drawer-list-container">
            <h3>Mes Tiroirs</h3>
            <ul id="drawer-list"></ul>
            <div class="data-actions">
                <button class="btn-secondary" onclick="exportJSON()">💾 Exporter Backup</button>
                <button class="btn-secondary" onclick="document.getElementById('import-file').click()">📂 Importer JSON</button>
                <input type="file" id="import-file" style="display:none" onchange="importJSON(this)">
            </div>
        </aside>

        <section id="grid-view">
            <div id="drawer-header" class="hidden">
                <h2 id="current-drawer-title"></h2>
                <button id="btn-delete-drawer" title="Supprimer ce tiroir">🗑️</button>
            </div>
            <div id="drawer-grid" class="grid-container"></div>
        </section>
    </main>

    <!-- Modale : Création de tiroir -->
    <div id="modal-drawer" class="modal hidden">
        <div class="modal-content">
            <h2>Nouveau Tiroir</h2>
            <input type="text" id="drawer-name" placeholder="Nom du tiroir">
            <div class="dimensions">
                <input type="number" id="drawer-width" placeholder="Cols" min="1">
                <input type="number" id="drawer-height" placeholder="Lignes" min="1">
            </div>
            <label>Orientation des bobines :</label>
            <select id="drawer-orientation-global">
                <option value="horizontal">Horizontal (▬)</option>
                <option value="vertical">Vertical (▮)</option>
            </select>
            <div class="modal-actions">
                <button id="btn-save-drawer">Créer</button>
                <button class="btn-cancel" onclick="closeModals()">Annuler</button>
            </div>
        </div>
    </div>

    <!-- Modale : Édition d'un filament -->
    <div id="modal-filament" class="modal hidden">
        <div class="modal-content">
            <h2>Détails du Filament</h2>
            <input type="hidden" id="slot-x">
            <input type="hidden" id="slot-y">
            
            <label>Matériau :</label>
            <select id="fil-material" onchange="toggleCustomMaterial()">
                <option value="PLA">PLA</option>
                <option value="PETG">PETG</option>
                <option value="ABS">ABS</option>
                <option value="TPU">TPU</option>
                <option value="ASA">ASA</option>
                <option value="Autre">-- Autre --</option>
            </select>
            <input type="text" id="fil-custom-material" class="hidden" placeholder="Entrez le matériau">

            <label>Gamme :</label>
            <input type="text" id="fil-range" placeholder="ex: Matte, Silk, High-Flow...">

            <label>Marque :</label>
            <input type="text" id="fil-brand" placeholder="ex: Polymaker, Sunlu...">

            <label>Couleur :</label>
            <div class="color-picker-wrapper">
                <input type="color" id="fil-color" value="#3498db">
                <div id="color-preview" class="color-preview"></div>
                <span id="color-hex-display">#3498DB</span>
            </div>

            <label class="checkbox-label">
                <input type="checkbox" id="fil-rfid"> Système RFID
            </label>

            <div class="modal-actions">
                <button id="btn-save-filament">Enregistrer</button>
                <button id="btn-delete-filament" style="background-color: #e74c3c;">Vider</button>
                <button class="btn-cancel" onclick="closeModals()">Annuler</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
